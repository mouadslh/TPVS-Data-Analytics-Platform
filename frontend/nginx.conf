server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Frontend health check
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"tpvs-frontend"}';
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
