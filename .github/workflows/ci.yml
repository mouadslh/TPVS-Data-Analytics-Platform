name: Lint & Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root
          MYSQL_DATABASE: tpvs_operational
          MYSQL_USER: tpvs_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptest_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tpvs_dwh
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: tpvs_dwh
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tpvs_dwh -d tpvs_dwh"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config
          pip install -r requirements.txt

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      - name: Run backend tests
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key
          DJANGO_DEBUG: "true"
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DATABASE: tpvs_operational
          MYSQL_USER: tpvs_user
          MYSQL_PASSWORD: test_password
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          POSTGRES_DB: tpvs_dwh
          POSTGRES_USER: tpvs_dwh
          POSTGRES_PASSWORD: test_password
          REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          python manage.py migrate --noinput
          pytest

  frontend-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Vitest
        working-directory: frontend
        run: npm run test

      - name: TypeScript build check
        working-directory: frontend
        run: npm run build

  airflow-dag-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate DAG syntax
        run: |
          for f in airflow/dags/*.py; do
            python -m py_compile "$f"
          done
